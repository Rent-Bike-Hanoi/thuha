<aside class="author-box" aria-label="Thông tin người xuất bản">
  <a class="author-box-logo" href="{author_url}"><img src="/assets/nguyen-ha-logo.svg" alt="{site_name}" width="64" height="64" loading="lazy" decoding="async"></a>
  <div class="author-box-body">
    <p class="author-box-name"><a href="{author_url}" rel="author">{author_name}</a> · {site_name}</p>
    <p class="author-box-desc">Chia sẻ kiến thức xe máy, xe điện, du lịch và kinh nghiệm di chuyển an toàn, thực tế tại Hà Nội.</p>
    <p class="author-box-contact">{business_address} · {business_hours}<br><a href="tel:{business_phone_clean}">{business_phone}</a> · <a href="{zalo_url}" rel="noopener">Zalo</a></p>
  </div>
</aside>
